<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tienda Sermiteop</title>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", Arial;
  background: #0b1020;
  color: white;
}

header {
  padding: 30px;
  text-align: center;
  background: linear-gradient(90deg, #0f172a, #111c33);
  border-bottom: 1px solid #1f2a44;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 18px;
  padding: 25px;
  max-width: 1100px;
  margin: auto;
}

.card {
  background: #111a2e;
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid #1e2a44;
  transition: 0.25s ease;
}

.card:hover {
  transform: translateY(-8px);
}

.card img {
  width: 100%;
  height: 140px;
  object-fit: cover;
  cursor: pointer;
}

.content {
  padding: 12px;
}

.title { margin: 0; font-size: 16px; }
.desc { font-size: 13px; color: #a8b6d6; }

.tag {
  display: inline-block;
  padding: 4px 10px;
  font-size: 11px;
  border-radius: 8px;
  background: #1e2a4a;
  color: #7db2ff;
}

.btn {
  display: block;
  text-align: center;
  padding: 10px;
  margin-top: 10px;
  border-radius: 10px;
  background: #3b82f6;
  color: white;
  text-decoration: none;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  z-index: 1000;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
}

.modal-contenido {
  display: block;
  margin: auto;
  max-width: 80%;
  max-height: 80vh;
  margin-top: 5%;
}

.cerrar {
  position: absolute;
  top: 15px;
  right: 25px;
  font-size: 40px;
  cursor: pointer;
}
</style>
</head>

<body>

<header>
  <h1>🪟 App Store</h1>
  <p>Descarga proyectos de Estudio Sermiteop™</p>
</header>

<div class="grid">

  <div class="card">
    <img src="IMAGEN-POS.png" onclick="abrir(this)">
    <div class="content">
      <div class="tag">HTML</div>
      <h3 class="title">Inventario Windows</h3>
      <p class="desc">Sistema  hecho en HTML. (Solo se puede descargar en PC)</p>
      <a class="btn" href="https://github.com/Eduardo61101/Tienda/releases/v1.0/Mi.Inventario.3.0.0.exe" download>⬇ Descargar ARCHIVO .exe</a>
    </div>
  </div>

<div class="card">
    <img src="IMAGEN-POShtml.png" onclick="abrir(this)">
    <div class="content">
      <div class="tag">HTML</div>
      <h3 class="title">Inventario Windows</h3>
      <p class="desc">Sistema  hecho en HTML. (puedes ir a la pag. sin instalar nada)</p>
      <a href="https://eduardo61101.github.io/POS-INVENTARIO/" class="btn">Ir a la Pag. WEB</a>
    </div>
  </div>


</div>

<!-- UN SOLO MODAL -->
<div id="modal" class="modal" onclick="cerrar(event)">
  <span class="cerrar">&times;</span>
  <img id="modalImg" class="modal-contenido">
</div>

<script>
function abrir(img) {
  document.getElementById("modal").style.display = "block";
  document.getElementById("modalImg").src = img.src;
}

function cerrar(e) {
  if (e.target.id === "modal" || e.target.className === "cerrar") {
    document.getElementById("modal").style.display = "none";
  }
}
</script>

</body>
</html>
